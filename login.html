<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Digital Well-being</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-topbar"><div class="auth-topbar-inner">
    <a class="brand" href="index.html" style="text-decoration:none"><span class="dot"></span> Digital Well-being</a>
    <nav class="auth-nav"><a class="active" href="login.html">Login</a><a href="registration.html">Registration</a><a href="index.html">Home</a></nav>
  </div></header>
  <main class="auth-main">
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-intro">Log in to continue your digital well-being journey.</p>
      <form id="login-form" novalidate>
        <div class="auth-field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required><small class="field-error" id="login-email-error"></small></div>
        <div class="auth-field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><small class="field-error" id="login-password-error"></small></div>
        <button class="auth-submit" type="submit">Log in</button>
        <div id="login-message" class="auth-message" role="status" aria-live="polite"></div>
      </form>
      <p class="auth-switch">Don't have an account? <a href="registration.html">Create one</a></p>
    </section>
  </main>
  <footer class="auth-footer">Digital Well-being &amp; Mental Health</footer>
</body>
</html>
